name: Android APK (Lire avec Pio)

on:
  push:
    branches: [claude/android-apk]
    paths: ['lecture/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lecture
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Valider le contenu pédagogique
        run: node tools/build-data.mjs

      - name: Créer le projet Android
        run: npx cap add android

      - name: Voix française (Android 11+) et icône
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          q = '<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\n    '
          if 'TTS_SERVICE' not in s:
              s = s.replace('<application', q + '<application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=android/app/src/main/res/mipmap-${pair%%:*}
            mkdir -p "$d"
            convert app/icons/icon-512.png -resize ${pair##*:}x${pair##*:} "$d/ic_launcher.png"
            cp "$d/ic_launcher.png" "$d/ic_launcher_round.png"
          done

      - name: Synchroniser l'application web
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: lecture/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk lire-avec-pio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lire-avec-pio-apk
          path: lecture/lire-avec-pio.apk
          if-no-files-found: error
